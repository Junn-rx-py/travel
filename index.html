<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧旅遊規劃 App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖標庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- 頂部導航列 (包含 6 個 Tabs 與手機端橫向捲動) -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-3">
            <h1 class="text-xl font-bold flex items-center">
                <i class="fa-solid fa-plane-departure mr-2"></i>Smart Travel Planner
            </h1>
            <nav class="flex space-x-1 overflow-x-auto w-full md:w-auto pb-1 md:pb-0 no-scrollbar">
                <button onclick="switchTab('login')" id="btn-login" class="px-3 py-1.5 rounded-lg hover:bg-indigo-500 text-sm font-medium whitespace-nowrap transition">🔐 登入</button>
                <button onclick="switchTab('map')" id="btn-map" class="px-3 py-1.5 rounded-lg hover:bg-indigo-500 text-sm font-medium whitespace-nowrap transition">🗺️ 地圖口袋</button>
                <button onclick="switchTab('itinerary')" id="btn-itinerary" class="px-3 py-1.5 rounded-lg bg-indigo-700 text-sm font-medium whitespace-nowrap transition shadow-sm">📅 主行程</button>
                <button onclick="switchTab('skipped')" id="btn-skipped" class="px-3 py-1.5 rounded-lg hover:bg-indigo-500 text-sm font-medium whitespace-nowrap transition">⚠️ 已跳過</button>
                <button onclick="switchTab('links')" id="btn-links" class="px-3 py-1.5 rounded-lg hover:bg-indigo-500 text-sm font-medium whitespace-nowrap transition">🔗 便利連結</button>
                <button onclick="switchTab('documents')" id="btn-documents" class="px-3 py-1.5 rounded-lg hover:bg-indigo-500 text-sm font-medium whitespace-nowrap transition">📁 文件中心</button>
            </nav>
        </div>
    </header>

    <!-- 主要內容動態掛載區 -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6">
        <div id="app-container">
            <!-- 載入中的過場提示，等 dyna.js 取得 GAS 資料後會自動替換 -->
            <div class="text-center py-20 text-slate-400">
                <i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-indigo-600"></i>
                <p class="text-sm font-medium">正在從雲端安全載入介面模組與資料...</p>
            </div>
        </div>
    </main>

    <!-- 載入前端固定設定檔與動態載入引擎 -->
    <script src="config.js"></script>
    <script src="dyna.js"></script>
</body>
</html>
