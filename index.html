<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧旅遊規劃 App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖標庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- 頂部導航列 (初始載入時的預設骨架標題) -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold"><i class="fa-solid fa-plane-departure mr-2"></i>Smart Travel Planner</h1>
        </div>
    </header>

    <!-- 主要內容動態掛載區 -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6">
        <div id="app-container">
            <!-- 載入中的過場提示，等 dyna.js 取得 GAS 資料後會自動替換 -->
            <div class="text-center py-20 text-slate-400">
                <i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-indigo-600"></i>
                <p class="text-sm font-medium">正在從雲端安全載入介面模組與資料...</p>
            </div>
        </div>
    </main>

    <!-- 載入前端固定設定檔與動態載入引擎 -->
    <script src="config.js"></script>
    <script src="dyna.js"></script>
</body>
</html>
